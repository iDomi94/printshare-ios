name: PrintShare
options:
  bundleIdPrefix: com.dominiqueherbrigpersonalteam
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: de
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.9.0"          # = version in mobile/app.json of the Expo app
    CURRENT_PROJECT_VERSION: "100"      # above the EAS build numbers
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  PrintShare:
    type: application
    platform: iOS
    sources:
      - path: PrintShare
    dependencies:
      - target: ShareExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dominiqueherbrigpersonalteam.printshare
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    entitlements:
      path: PrintShare/PrintShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.dominiqueherbrigpersonalteam.printshare
    info:
      path: PrintShare/Info.plist
      properties:
        # XcodeGen writes 1.0 / 1 otherwise; App Store Connect needs the build settings (set per upload by testflight.yml)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: PocketPrint3D
        CFBundleLocalizations: [de, en]
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Automatic
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: PocketPrint3D connects to your own PocketPrint3D server and to your 3D printers in your home network.
        NSCameraUsageDescription: PocketPrint3D uses the camera only to scan the pairing QR code of your server.
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.dominiqueherbrigpersonalteam.printshare
            CFBundleURLSchemes: [printshare]
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
        excludes: ["Info.plist"]
      - path: PrintShare/Storage/SharedInbox.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dominiqueherbrigpersonalteam.printshare.share-extension
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.dominiqueherbrigpersonalteam.printshare
    info:
      path: ShareExtension/Info.plist
      properties:
        # XcodeGen writes 1.0 / 1 otherwise; App Store Connect needs the build settings (set per upload by testflight.yml)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: PocketPrint3D
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsFileWithMaxCount: 1
  PrintShareTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PrintShareTests
    dependencies:
      - target: PrintShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dominiqueherbrigpersonalteam.printshare.tests
        GENERATE_INFOPLIST_FILE: YES
        # test doubles (URLProtocol stub) share mutable state; the app itself builds in Swift 6 mode
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
schemes:
  PrintShare:
    build:
      targets:
        PrintShare: all
        ShareExtension: all
    test:
      targets:
        - PrintShareTests
