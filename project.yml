name: PrintShare
options:
  bundleIdPrefix: com.dominiqueherbrigpersonalteam
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: de
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.9.18"         # = version in mobile/app.json of the Expo app
    CURRENT_PROJECT_VERSION: "100"      # above the EAS build numbers
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  PrintShare:
    type: application
    platform: iOS
    sources:
      - path: PrintShare
      - path: Shared
    dependencies:
      - target: ShareExtension
        embed: true
      # push notifications + Live Activities (server 0.51.0)
      - target: NotificationService
        embed: true
      - target: PrintWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dominiqueherbrigpersonalteam.printshare
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    entitlements:
      path: PrintShare/PrintShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.dominiqueherbrigpersonalteam.printshare
        # spools by NFC chip (server 0.38.0) and OpenPrintTag: "NFC Tag Reading" on the App ID
        com.apple.developer.nfc.readersession.formats:
          - TAG
        # push notifications (server 0.51.0): "Push Notifications" + "Time Sensitive Notifications" on the App ID;
        # Xcode switches it to production when exporting for TestFlight
        aps-environment: development
        com.apple.developer.usernotifications.time-sensitive: true
    info:
      path: PrintShare/Info.plist
      properties:
        # XcodeGen writes 1.0 / 1 otherwise; App Store Connect needs the build settings (set per upload by testflight.yml)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: PocketPrint3D
        CFBundleLocalizations: [de, en]
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Automatic
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: PocketPrint3D connects to your own PocketPrint3D server and to your 3D printers in your home network.
        NSCameraUsageDescription: PocketPrint3D uses the camera only to scan the pairing QR code of your server.
        NFCReaderUsageDescription: PocketPrint3D reads the NFC chip of a filament spool to know which spool it is.
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        CFBundleURLTypes:
          - CFBundleURLName: com.dominiqueherbrigpersonalteam.printshare
            CFBundleURLSchemes: [printshare]
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
        excludes: ["Info.plist"]
      - path: PrintShare/Storage/SharedInbox.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dominiqueherbrigpersonalteam.printshare.share-extension
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.dominiqueherbrigpersonalteam.printshare
    info:
      path: ShareExtension/Info.plist
      properties:
        # XcodeGen writes 1.0 / 1 otherwise; App Store Connect needs the build settings (set per upload by testflight.yml)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: PocketPrint3D
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsFileWithMaxCount: 1
  NotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationService
        excludes: ["Info.plist"]
      - path: Shared/PushPayload.swift
      - path: Shared/PrintActivity.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dominiqueherbrigpersonalteam.printshare.notification-service
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    entitlements:
      path: NotificationService/NotificationService.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.dominiqueherbrigpersonalteam.printshare
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: PocketPrint3D
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
  PrintWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: PrintWidgets
        excludes: ["Info.plist"]
      - path: Shared/PrintActivity.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dominiqueherbrigpersonalteam.printshare.widgets
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    entitlements:
      path: PrintWidgets/PrintWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.dominiqueherbrigpersonalteam.printshare
    info:
      path: PrintWidgets/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: PocketPrint3D
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  PrintShareTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PrintShareTests
    dependencies:
      - target: PrintShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dominiqueherbrigpersonalteam.printshare.tests
        GENERATE_INFOPLIST_FILE: YES
        # test doubles (URLProtocol stub) share mutable state; the app itself builds in Swift 6 mode
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
schemes:
  PrintShare:
    build:
      targets:
        PrintShare: all
        ShareExtension: all
        NotificationService: all
        PrintWidgets: all
    test:
      targets:
        - PrintShareTests
